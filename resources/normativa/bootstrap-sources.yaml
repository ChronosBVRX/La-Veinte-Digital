# BIBLIOTECA NORMATIVA IMSS/SNTSS — MANIFEST DE BOOTSTRAP
# Fecha de corte inicial del corpus: 2026-08-14
# Regla fundamental: LA IA NO ES LA FUENTE. LA FUENTE ES EL DOCUMENTO.
#
# Jerarquía de fuentes:
#   NIVEL A (canónica): DOF, Cámara de Diputados, imss.gob.mx, reposipot.imss.gob.mx,
#                       sntss.org.mx, media.sntss.org.mx, STPS/gob.mx
#   NIVEL B (auxiliar):  fuentes institucionales que referencian al documento
#   NIVEL C (descubrimiento): buscadores/web — NO se convierten en fuente normativa
#
# NOTAS DE VERIFICACIÓN (2026-08-14):
# - CCT 2025-2027: vigente del 2025-10-16 al 2027-10-15 (firma IMSS-SNTSS).
# - Estatutos SNTSS: la edición publicada actualmente por el SNTSS es octubre 2022.
#   Durante 2026 existe proceso formal de modificación estatutaria. Estado: PENDING_REVIEW.
# - Tabulador de Base: vigencia 2025-10-16 a 2026-10-15 (DISTINTA del CCT). Alertar antes de expirar.
# - Leyes federales: usar compilaciones de Cámara de Diputados (LFT reforma DOF 2026-05-14;
#   LSS 2026-01-15; CPEUM 2026-06-02). No usar copias viejas de portales sindicales.
# - Dominios permitidos (allowlist): imss.gob.mx, reposipot.imss.gob.mx, sntss.org.mx,
#   media.sntss.org.mx, diputados.gob.mx, dof.gob.mx, gob.mx, stps.gob.mx
# - www.imss.gob.mx protege con Incapsula por frecuencia: descargas en serie, lentas.
# - dof.gob.mx: algunas URLs fallan con "www." (ej. NOM-036): usar sin www.

cutoff: "2026-08-14"

settings:
  download:
    maxConcurrency: 1
    minDelayMs: 15000         # imss.gob.mx penaliza ráfagas (Incapsula)
    timeoutMs: 120000
    maxRetries: 4
    backoffBaseMs: 30000
    cacheEnabled: true
    allowlistDomains:
      - imss.gob.mx
      - reposipot.imss.gob.mx
      - sntss.org.mx
      - media.sntss.org.mx
      - diputados.gob.mx
      - dof.gob.mx
      - gob.mx
      - stps.gob.mx
  alerts:
    - id: TABULADOR-BASE-EXPIRA
      document: IMSS-TABULADOR-BASE-2025-2026
      expiresOn: "2026-10-15"
      warnDaysBefore: 30
      message: "EXPIRA PRÓXIMAMENTE — buscar nuevo tabulador oficial"
    - id: CCT-FIN-VIGENCIA
      document: CCT-IMSS-SNTSS-2025-2027
      expiresOn: "2027-10-15"
      warnDaysBefore: 90
      message: "EL CCT SE ACERCA AL FIN DE SU VIGENCIA — buscar nueva versión"
  monitors:
    - id: ESTATUTOS-SNTSS-REFORMA
      kind: keyword
      urls:
        - https://sntss.org.mx/documentos/
        - https://www.sntss.org.mx/convocatorias
        - https://sntss.org.mx/noticias/
      keywords:
        - Estatutos
        - Estatutos 2026
        - reforma estatutaria
        - Congreso Nacional Extraordinario
        - marco estatutario

