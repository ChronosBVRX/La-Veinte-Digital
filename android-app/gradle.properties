# JVM arguments for the Gradle daemon
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Run Gradle in parallel when possible
org.gradle.parallel=true

# Cache build outputs between builds
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class (smaller R classes)
android.nonTransitiveRClass=true

# Don't fail build on warnings about unstable AndroidX properties
android.suppressUnsupportedCompileSdk=36
