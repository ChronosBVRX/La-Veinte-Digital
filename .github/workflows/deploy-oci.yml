name: Deploy to OCI (Always Free VPS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-oci
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Oracle Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prepare environment file
        run: |
          echo "${{ secrets.ENV_PRODUCTION_LOCAL }}" > .env.production.local
          chmod 600 .env.production.local

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_deploy_key
          chmod 600 ~/.ssh/oci_deploy_key
          ssh-keyscan -H ${{ secrets.OCI_VPS_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Build and deploy to OCI VPS
        env:
          OCI_VPS_IP: ${{ secrets.OCI_VPS_IP }}
          OCI_VPS_USER: ${{ secrets.OCI_VPS_USER }}
          OCI_SSH_KEY: /home/runner/.ssh/oci_deploy_key
        run: |
          npm run build
          node scripts/deploy-oci-web.mjs

      - name: Verify production deployment
        run: |
          echo "Verificando https://la20.com.mx/api/health..."
          curl -f -sS https://la20.com.mx/api/health || exit 1
