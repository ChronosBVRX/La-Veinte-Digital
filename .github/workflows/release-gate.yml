name: Release Gate

# Reproducible CI gate: validates the production release pipeline end-to-end.
# Frontend (typecheck/lint/test/build) is covered by ci.yml; this job covers the
# Android release channel split, release lint, unit tests, AAB, APKs, the
# distribution-policy contract and 16 KB page-size compliance.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Add build tools to PATH
        run: echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Unit tests (play + direct)
        run: ./gradlew :app:testPlayDebugUnitTest :app:testDirectDebugUnitTest --console=plain

      - name: Distribution-policy contract (release manifest)
        run: ./gradlew :app:validateDistributionPolicyPlayRelease :app:validateDistributionPolicyDirectRelease --console=plain

      - name: Release lint (play + direct)
        run: ./gradlew :app:lintPlayRelease :app:lintDirectRelease --console=plain

      - name: Assemble release AAB + APKs
        env:
          LAVEINTE_KEYSTORE_BASE64: ${{ secrets.LAVEINTE_KEYSTORE_BASE64 }}
          LAVEINTE_KEYSTORE_PASSWORD: ${{ secrets.LAVEINTE_KEYSTORE_PASSWORD }}
          LAVEINTE_KEY_ALIAS: ${{ secrets.LAVEINTE_KEY_ALIAS }}
          LAVEINTE_KEY_PASSWORD: ${{ secrets.LAVEINTE_KEY_PASSWORD }}
        run: ./gradlew :app:assemblePlayRelease :app:bundlePlayRelease :app:assembleDirectRelease --console=plain

      - name: 16 KB page-size compliance (zipalign -P 16)
        run: |
          APK=$(find app/build/outputs/apk/direct/release -name '*.apk' | head -1)
          echo "APK: $APK"
          zipalign -c -P 16 -v 4 "$APK" | tail -1

      - name: Verify signing if secrets are available
        if: env.LAVEINTE_KEYSTORE_BASE64 != ''
        env:
          LAVEINTE_KEYSTORE_BASE64: ${{ secrets.LAVEINTE_KEYSTORE_BASE64 }}
        run: |
          APK=$(find app/build/outputs/apk/direct/release -name '*.apk' | head -1)
          apksigner verify --verbose --print-certs "$APK" | grep -E 'certificate SHA-256 digest' || true

      - name: Upload AAB + release APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-release-artifacts
          path: |
            android-app/app/build/outputs/bundle/playRelease/*.aab
            android-app/app/build/outputs/apk/play/release/*.apk
            android-app/app/build/outputs/apk/direct/release/*.apk
          if-no-files-found: error
