name: Print Agent Windows Installer

on:
  push:
    tags:
      - 'print-agent-v*'
    paths:
      - 'apps/print-agent/**'
      - '.github/workflows/print-agent-windows.yml'
  pull_request:
    paths:
      - 'apps/print-agent/**'
      - '.github/workflows/print-agent-windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar release en GitHub?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build NSIS Installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/print-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS Package
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaVeintePrint-Setup
          path: apps/print-agent/dist/*.exe
          if-no-files-found: error

      - name: Publish Release Asset (Tag or Manual)
        if: startsWith(github.ref, 'refs/tags/print-agent-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          files: apps/print-agent/dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
