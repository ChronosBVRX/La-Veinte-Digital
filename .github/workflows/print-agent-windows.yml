name: Print Agent Windows Installer

on:
  push:
    tags:
      - 'print-agent-v*'
    branches:
      - main
    paths:
      - 'apps/print-agent/**'
      - '.github/workflows/print-agent-windows.yml'
  pull_request:
    paths:
      - 'apps/print-agent/**'
      - '.github/workflows/print-agent-windows.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '¿Publicar release en GitHub?'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag del release (opcional, ej. print-agent-v1.0.0; por defecto usa package.json)'
        required: false
        type: string

jobs:
  build:
    name: Build NSIS Installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/print-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      - name: Build Windows NSIS Package (x64 & x86)
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Installers Exist
        shell: pwsh
        run: |
          $expected = @(
            "dist/LaVeintePrint-Setup.exe",
            "dist/LaVeintePrint-Setup-x64.exe",
            "dist/LaVeintePrint-Setup-x86.exe"
          )
          foreach ($installerPath in $expected) {
            if (-not (Test-Path $installerPath)) {
              Write-Error "El instalador esperado '$installerPath' no fue encontrado en apps/print-agent."
              exit 1
            }
            $item = Get-Item $installerPath
            Write-Host "Instalador verificado exitosamente: $($item.FullName) ($($item.Length) bytes)"
          }

      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LaVeintePrint-Setup
          path: |
            apps/print-agent/dist/LaVeintePrint-Setup.exe
            apps/print-agent/dist/LaVeintePrint-Setup-x64.exe
            apps/print-agent/dist/LaVeintePrint-Setup-x86.exe
          if-no-files-found: error

      - name: Determine Release Tag
        id: release_info
        if: startsWith(github.ref, 'refs/tags/print-agent-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        shell: pwsh
        run: |
          if ("${{ github.ref }}".StartsWith("refs/tags/print-agent-v")) {
            $tag = "${{ github.ref_name }}"
          } elseif ("${{ inputs.tag_name }}".Trim() -ne "") {
            $tag = "${{ inputs.tag_name }}".Trim()
          } else {
            $pkg = Get-Content package.json -Raw | ConvertFrom-Json
            $tag = "print-agent-v$($pkg.version)"
          }
          Write-Host "Tag de release determinado: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish Release Assets (Tag or Manual)
        if: startsWith(github.ref, 'refs/tags/print-agent-v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: La Veinte Print ${{ steps.release_info.outputs.tag }}
          files: |
            apps/print-agent/dist/LaVeintePrint-Setup.exe
            apps/print-agent/dist/LaVeintePrint-Setup-x64.exe
            apps/print-agent/dist/LaVeintePrint-Setup-x86.exe
          generate_release_notes: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
