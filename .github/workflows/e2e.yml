name: E2E Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  # ── Unit / typecheck / lint ──
  check:
    name: Typecheck + Lint + Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # ── E2E: public (no auth needed, runs on all PRs) ──
  e2e-public:
    name: E2E Public (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - name: Run E2E public tests
        run: npx playwright test --project=chromium-public
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-public-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── E2E: authenticated (requires secrets, only on internal branches) ──
  e2e-authenticated:
    name: E2E Authenticated (Chrome, Firefox, Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run E2E smoke tests
        run: npx playwright test e2e/smoke/ --project=chromium-desktop --project=chromium-mobile
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Run E2E full tests
        if: success() || failure()
        run: npx playwright test --project=chromium-desktop
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-auth-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ── E2E: full manual (nocturnal / manual dispatch) ──
  e2e-full-manual:
    name: E2E Full (Manual / Nocturnal)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: check
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps
      - name: Run all E2E tests
        run: npx playwright test
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-full-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
