name: Push Campaigns Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  push-campaigns:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger Push Campaigns Cron
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://la-veinte-digital.vercel.app/api/cron/push-campaigns" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          echo "Status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Cron execution failed with HTTP status: $STATUS"
            exit 1
          fi
