name: Android Build

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
  pull_request:
    branches: [main]
    paths:
      - 'android-app/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Canal de publicación'
        required: true
        type: choice
        default: 'dev'
        options: [dev, beta, stable]
      promote:
        description: '¿Actualizar latest.json automáticamente?'
        required: false
        type: boolean
        default: false

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Extract version info
        id: version
        run: |
          VCODE=$(grep 'versionCode' app/build.gradle.kts | grep -v '//' | head -1 | sed 's/[^0-9]*//g')
          VNAME=$(grep 'versionName' app/build.gradle.kts | grep -v '//' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "versionCode=${VCODE}" >> $GITHUB_OUTPUT
          echo "versionName=${VNAME}" >> $GITHUB_OUTPUT
          echo "versionCode=${VCODE}  versionName=${VNAME}"

      - name: Build debug APK
        run: ./gradlew :app:assemblePlayDebug :app:assembleDirectDebug

      - name: Build release APK (play + direct) and Play AAB
        if: github.event_name == 'workflow_dispatch'
        env:
          LAVEINTE_KEYSTORE_BASE64: ${{ secrets.LAVEINTE_KEYSTORE_BASE64 }}
          LAVEINTE_KEYSTORE_PASSWORD: ${{ secrets.LAVEINTE_KEYSTORE_PASSWORD }}
          LAVEINTE_KEY_ALIAS: ${{ secrets.LAVEINTE_KEY_ALIAS }}
          LAVEINTE_KEY_PASSWORD: ${{ secrets.LAVEINTE_KEY_PASSWORD }}
        run: ./gradlew :app:assemblePlayRelease :app:assembleDirectRelease :app:bundlePlayRelease

      - name: Verify release signature
        if: github.event_name == 'workflow_dispatch'
        run: |
          APK=$(find app/build/outputs/apk/direct/release -name "*.apk" | head -1)
          echo "=== Cert info ==="
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose --print-certs "$APK"
          echo "=== Verification passed ==="

      - name: Compute APK hashes and size
        if: github.event_name == 'workflow_dispatch'
        id: apk
        run: |
          APK=$(find app/build/outputs/apk/direct/release -name "*.apk" | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$APK")
          echo "sha256=${SHA}" >> $GITHUB_OUTPUT
          echo "size=${SIZE}" >> $GITHUB_OUTPUT
          echo "apk_path=${APK}" >> $GITHUB_OUTPUT
          echo "=== APK (channel direct) ==="
          echo "SHA-256: $SHA"
          echo "Size:    $(echo "scale=1; $SIZE/1048576" | bc) MB"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: |
            android-app/app/build/outputs/apk/play/debug/*.apk
            android-app/app/build/outputs/apk/direct/debug/*.apk

      - name: Upload release artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            android-app/app/build/outputs/apk/play/release/*.apk
            android-app/app/build/outputs/apk/direct/release/*.apk
            android-app/app/build/outputs/bundle/playRelease/*.aab

      - name: Upload to Supabase Storage
        if: github.event_name == 'workflow_dispatch'
        id: upload
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # Canal Direct = flavor direct explícito. Sin find/head ambiguos: el APK
          # hasheado debe ser exactamente el mismo que se sube.
          APK_DIR="app/build/outputs/apk/direct/release"
          COUNT=$(ls "$APK_DIR"/*.apk 2>/dev/null | wc -l)
          if [ "$COUNT" != "1" ]; then
            echo "Se esperaba exactamente 1 APK en $APK_DIR, encontrados: $COUNT"
            ls -la "$APK_DIR" || true
            exit 1
          fi
          APK=$(realpath "$APK_DIR"/*.apk)
          cd ..
          npm install --no-audit --no-fund --ignore-scripts --no-save @supabase/supabase-js
          OUT=$(node scripts/upload-android-release.mjs "$APK" "${{ github.event.inputs.channel }}" "${{ steps.version.outputs.versionName }}")
          echo "$OUT"
          URL=$(echo "$OUT" | grep -oE 'https://[^ ]+/android-releases/[^ ]+' | head -1)
          if [ -z "$URL" ]; then
            echo "No se pudo extraer la URL pública del APK"
            exit 1
          fi
          echo "public_url=${URL}" >> $GITHUB_OUTPUT

      - name: Promote latest.json
        # Contrato real del input `promote`:
        # - promote=false → compilar/firmar/verificar/subir, SIN tocar latest.json.
        # - promote=true  → además actualiza public/android/<channel>/latest.json
        #   con los valores REALES (versión, SHA, tamaño, URL, fecha) y lo publica
        #   commiteando a la misma rama. Si el push es rechazado, falla en voz alta.
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd ..
          CHANNEL="${{ github.event.inputs.channel }}"
          node -e "
            const fs = require('fs');
            const p = 'public/android/' + '${CHANNEL}' + '/latest.json';
            const latest = JSON.parse(fs.readFileSync(p, 'utf8'));
            latest.channel = '${CHANNEL}';
            latest.versionCode = Number('${{ steps.version.outputs.versionCode }}');
            latest.versionName = '${{ steps.version.outputs.versionName }}';
            latest.publishedAt = new Date().toISOString();
            latest.apk = {
              url: '${{ steps.upload.outputs.public_url }}',
              sha256: '${{ steps.apk.outputs.sha256 }}',
              size: Number('${{ steps.apk.outputs.size }}'),
            };
            fs.writeFileSync(p, JSON.stringify(latest, null, 2) + '\n');
            console.log('latest.json actualizado: ' + p);
          "
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "public/android/${CHANNEL}/latest.json"
          git commit -m "chore(android): promote ${CHANNEL} to ${{ steps.version.outputs.versionName }} (${{ steps.version.outputs.versionCode }})" || { echo "Sin cambios que promover"; exit 0; }
          git push origin "HEAD:${{ github.ref_name }}" || { echo "PUSH RECHAZADO: la política de rama bloqueó la promoción automática; aplicar latest.json manualmente"; exit 1; }

      - name: Print release summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "============================================"
          echo " RELEASE BUILD COMPLETE"
          echo "============================================"
          echo " Channel:     ${{ github.event.inputs.channel }}"
          echo " Version:     ${{ steps.version.outputs.versionName }}"
          echo " VersionCode: ${{ steps.version.outputs.versionCode }}"
          echo " SHA-256:     ${{ steps.apk.outputs.sha256 }}"
          echo " Size:        $(echo "scale=1; ${{ steps.apk.outputs.size }}/1048576" | bc) MB"
          echo " Commit:      ${{ github.sha }}"
          echo "============================================"
          echo " Next steps:"
          echo "  1. Download the artifact from this run"
          echo "  2. Copy SHA-256 above to public/android/${{ github.event.inputs.channel }}/latest.json"
          echo "  3. Deploy to Vercel to publish"
          echo "============================================"
