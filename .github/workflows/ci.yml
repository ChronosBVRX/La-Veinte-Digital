name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Unit)
        run: npm test

      - name: Tests (Integration)
        run: npm run test:integration

      - name: Build
        run: npm run build

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migrations build a working database from scratch
        run: |
          supabase init --force
          supabase start
          supabase db reset

      - name: Check every table has RLS enabled
        run: |
          supabase db query --local --output-format json "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity AND c.relname NOT LIKE 'pg_%';" > rls_check.txt
          if [ -s rls_check.txt ] && ! grep -q '\[\]' rls_check.txt; then
            echo "Tablas sin RLS:"; cat rls_check.txt; exit 1
          fi

      - name: Check seeds and key tables exist after reset
        run: |
          supabase db query --local --output-format json "SELECT count(*) FROM public.vacation_mandatory_rest_days WHERE year = 2027;" | grep -q '"count": 12'
          supabase db query --local --output-format json "SELECT count(*) FROM pg_class WHERE relname IN ('profiles','payroll_contexts','worker_commitments') AND relnamespace='public'::regnamespace;" | grep -q '"count": 3'

      - name: Chat RLS functional tests (two users)
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/chat_rls.sql

      - name: Run Live PostgreSQL Restore Drill
        run: bash scripts/postgres-restore-drill.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_API_SHARED_SECRET: "ci-test-secret"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot-api/requirements.txt
          pip install -r bot-api/requirements-dev.txt

      - name: Python syntax check
        run: python -m compileall bot-api

      - name: Run tests
        working-directory: bot-api
        run: python -m pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E Public & Business Journeys
        run: npx playwright test --project=chromium-public
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if Android files changed
        id: changed-files
        run: |
          if git diff --name-only HEAD~1 HEAD | grep -q '^android-app/'; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Android files changed. Running Gradle verification..."
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No Android files changed in this commit. Skipping heavy compilation."
          fi

      - name: Set up JDK 17
        if: steps.changed-files.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changed-files.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests & Distribution Policy
        if: steps.changed-files.outputs.changed == 'true'
        run: ./gradlew test validateDistributionPolicyPlayRelease --console=plain

  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    needs: [validate, supabase-db, python, e2e, android]
    steps:
      - name: Production Release Confirmation
        run: |
          echo "================================================================"
          echo " ✅ ALL PRODUCTION GATES PASSED SUCCESSFULLY"
          echo "================================================================"
          echo "Commit is verified and ready for production deployment."
