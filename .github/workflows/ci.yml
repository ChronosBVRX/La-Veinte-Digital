name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migrations build a working database from scratch
        run: |
          supabase init --force
          supabase start
          supabase db reset

      - name: Check every table has RLS enabled
        run: |
          supabase db query --local --output-format json "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity AND c.relname NOT LIKE 'pg_%';" > rls_check.txt
          if [ -s rls_check.txt ] && ! grep -q '\[\]' rls_check.txt; then
            echo "Tablas sin RLS:"; cat rls_check.txt; exit 1
          fi

      - name: Check seeds and key tables exist after reset
        run: |
          supabase db query --local --output-format json "SELECT count(*) FROM public.vacation_mandatory_rest_days WHERE year = 2027;" | grep -q '"count": 12'
          supabase db query --local --output-format json "SELECT count(*) FROM pg_class WHERE relname IN ('chat_messages','forum_posts','profiles','payroll_contexts') AND relnamespace='public'::regnamespace;" | grep -q '"count": 4'

      - name: Chat RLS functional tests (two users)
        run: |
          set +e
          output=$(supabase db query --local -f supabase/tests/chat_rls.sql 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            msg=$(echo "$output" | tr '\n' ' ' | head -c 1500)
            echo "::error::$msg"
            exit $status
          fi

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_API_SHARED_SECRET: "ci-test-secret"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot-api/requirements.txt
          pip install -r bot-api/requirements-dev.txt

      - name: Python syntax check
        run: python -m compileall bot-api

      - name: Run tests
        working-directory: bot-api
        run: python -m pytest -v
