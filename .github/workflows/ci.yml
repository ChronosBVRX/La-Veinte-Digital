name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://example.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency Audit (High/Critical Fail-Closed)
        run: npm run audit:production

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests (Unit)
        run: npm test

      - name: Coverage Gate (Fail-Closed)
        run: npm run test:coverage

      - name: Build
        run: npm run build

  supabase-db:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure Docker concurrency and pre-pull images
        run: |
          if [ -f /etc/docker/daemon.json ]; then
            sudo jq '. + {"max-concurrent-downloads": 1}' /etc/docker/daemon.json > /tmp/daemon.json && sudo mv /tmp/daemon.json /etc/docker/daemon.json
          else
            echo '{"max-concurrent-downloads": 1}' | sudo tee /etc/docker/daemon.json
          fi
          sudo systemctl restart docker
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          images=(
            "ghcr.io/supabase/postgres:17.6.1.167"
            "ghcr.io/supabase/gotrue:v2.196.0"
            "ghcr.io/supabase/kong:2.8.1"
            "ghcr.io/supabase/postgres-meta:v0.99.0"
            "ghcr.io/supabase/postgrest:v16.2"
            "ghcr.io/supabase/storage-api:v1.72.1"
            "ghcr.io/supabase/realtime:v2.130.0"
            "ghcr.io/supabase/vector:0.53.0-alpine"
            "ghcr.io/supabase/mailpit:v1.30.2"
          )
          for img in "${images[@]}"; do
            for attempt in 1 2 3 4 5; do
              echo "Pulling $img (attempt $attempt)..."
              if docker pull "$img"; then
                break
              fi
              echo "Failed to pull $img, sleeping $((attempt * 3))s before retry..."
              sleep $((attempt * 3))
            done
          done

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify migrations build a working database from scratch
        run: |
          supabase init --force
          for attempt in 1 2 3; do
            echo "Attempt $attempt: starting Supabase stack..."
            if supabase start -x studio,logflare,edge-runtime,realtime,storage,storage-api,imgproxy,vector; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Failed to start Supabase stack after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          supabase db reset

      - name: Check every table has RLS enabled
        run: |
          supabase db query --local --output-format json "SELECT c.relname FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relkind IN ('r','p') AND NOT c.relrowsecurity AND c.relname NOT LIKE 'pg_%';" > rls_check.txt
          if [ -s rls_check.txt ] && ! grep -q '\[\]' rls_check.txt; then
            echo "Tablas sin RLS:"; cat rls_check.txt; exit 1
          fi

      - name: Check seeds and key tables exist after reset
        run: |
          supabase db query --local --output-format json "SELECT count(*) FROM public.vacation_mandatory_rest_days WHERE year = 2027;" | grep -q '"count": 12'
          supabase db query --local --output-format json "SELECT count(*) FROM pg_class WHERE relname IN ('profiles','payroll_contexts','worker_commitments') AND relnamespace='public'::regnamespace;" | grep -q '"count": 3'

      - name: Chat RLS functional tests (two users)
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/chat_rls.sql

      - name: User Isolation RLS functional tests (multi-user)
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/user_isolation_rls.sql

      - name: Tarjeton RPC functional contract tests
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/confirm_tarjeton_contract.sql

      - name: Locker Import RPC functional contract tests
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/union_locker_import_contract.sql

      - name: Admin User Control RPC functional contract tests
        run: |
          db_container=$(docker ps --format '{{.Names}}' | grep -E 'supabase_db_' | head -1)
          if [ -z "$db_container" ]; then
            echo "::error::no se encontró el contenedor supabase_db_"
            exit 1
          fi
          docker exec -i "$db_container" psql -v ON_ERROR_STOP=1 -v VERBOSITY=verbose \
            -U postgres -d postgres -f - < supabase/tests/admin_user_control.sql

      - name: Run Live PostgreSQL Restore Drill & Isolation Verification
        run: bash scripts/postgres-restore-drill.sh

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_API_SHARED_SECRET: "ci-test-secret"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot-api/requirements.txt
          pip install -r bot-api/requirements-dev.txt

      - name: Python syntax check
        run: python -m compileall bot-api

      - name: Run tests
        working-directory: bot-api
        run: python -m pytest -v

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: "https://ragktminwduiggvaoeix.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"
      OPENAI_API_KEY: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Build Next.js
        run: npm run build

      - name: Run E2E Public & Business Journeys
        run: npx playwright test --project=chromium-public
        env:
          CI: "true"
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: "https://ragktminwduiggvaoeix.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder-anon-key"

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check if Android-affecting paths changed across PR / commit range
        id: changed-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1 || true
            DIFF_FILES=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              DIFF_FILES=$(git diff --name-only HEAD~1 HEAD || true)
            else
              DIFF_FILES=$(git diff --name-only "$BEFORE...${{ github.sha }}")
            fi
          fi

          echo "$DIFF_FILES" > .temp_diff.txt

          AFFECTS=$(node --no-warnings --import tsx -e '
            import fs from "fs";
            import { doesAffectAndroid } from "./scripts/check-android-changes";
            const content = fs.existsSync(".temp_diff.txt") ? fs.readFileSync(".temp_diff.txt", "utf-8") : "";
            const files = content.split("\n").filter(Boolean);
            const result = doesAffectAndroid(files);
            console.log(result ? "true" : "false");
          ' 2>/dev/null || echo "true")
          rm -f .temp_diff.txt

          echo "affects_android=$AFFECTS" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        if: steps.changed-files.outputs.affects_android == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.changed-files.outputs.affects_android == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests & Distribution Policy
        if: steps.changed-files.outputs.affects_android == 'true'
        working-directory: android-app
        run: ./gradlew test validateDistributionPolicyPlayRelease --console=plain

      - name: Android Not Applicable Notice
        if: steps.changed-files.outputs.affects_android == 'false'
        run: |
          echo "================================================================"
          echo " ℹ️ ANDROID_NOT_APPLICABLE"
          echo "================================================================"
          echo "No se modificaron archivos en android-app/ ni contratos compartidos."
          echo "Se completa la compuerta de Android con éxito de forma determinista."

  production-gate:
    name: production-gate
    runs-on: ubuntu-latest
    needs: [validate, supabase-db, python, e2e, android]
    if: ${{ always() }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Evaluate Upstream Job Statuses (Fail-Closed)
        run: |
          node --no-warnings --import tsx scripts/evaluate-production-gate.ts \
            "${{ needs.validate.result }}" \
            "${{ needs.supabase-db.result }}" \
            "${{ needs.python.result }}" \
            "${{ needs.e2e.result }}" \
            "${{ needs.android.result }}"
